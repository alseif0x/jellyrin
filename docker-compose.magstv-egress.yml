services:
  magstv-egress:
    build:
      context: .
      dockerfile: ops/magstv-egress/Dockerfile
    image: jellyrin-magstv-egress:local
    container_name: jellyrin-magstv-egress
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.src_valid_mark: "1"
    ports:
      - 127.0.0.1:18080:18080
    volumes:
      - ${MAGSTV_WG_CONFIG_PATH:-/etc/jellyrin/mx.conf}:/run/secrets/mx.conf:ro
    tmpfs:
      - /run
      - /tmp
    environment:
      MAGSTV_EGRESS_LISTEN: 0.0.0.0:18080
      MAGSTV_WG_CONFIG: /run/secrets/mx.conf
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$$(curl -4 -fsS --max-time 10 -x http://127.0.0.1:18080
          https://ipinfo.io/country | tr -d '\r\n')" = MX
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
