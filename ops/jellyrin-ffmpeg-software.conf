[Service]
# Prefer the distribution FFmpeg build: it includes the software H.264/AAC
# encoders needed for browser-incompatible HEVC/AC3 sources. The main unit's
# CPUQuota plus Jellyrin's one-job/two-thread admission limits bound its cost.
Environment=PATH=/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin
