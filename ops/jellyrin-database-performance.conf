[Service]
# Profile for the 24 GiB PostgreSQL-backed host. The API pool remains small enough to avoid
# multiplying expensive catalogue work, while allowing the home screen's independent bounded
# requests to make progress concurrently. Keep the worker lane separate from interactive traffic.
Environment=JELLYRIN_DB_MAX_CONNECTIONS=10
Environment=JELLYRIN_DB_WORKER_MAX_CONNECTIONS=3
