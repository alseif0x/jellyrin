services:
  redis:
    image: ${REDIS_IMAGE:-docker.io/library/redis:8.2.8-bookworm@sha256:2f7462b9e93e0a7ae2edf3a0a0babc8a4d29f8bfc50849b906b7caaef925edc1}
    container_name: jellyrin-redis-cache
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "127.0.0.1:${JELLYRIN_REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - ${JELLYRIN_REDIS_CONFIG_FILE:?set JELLYRIN_REDIS_CONFIG_FILE}:/usr/local/etc/redis/redis.conf:ro
      - ${JELLYRIN_REDIS_PASSWORD_FILE:?set JELLYRIN_REDIS_PASSWORD_FILE}:/run/secrets/redis_password:ro
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 96m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          REDISCLI_AUTH="$$(cat /run/secrets/redis_password)"
          redis-cli --no-auth-warning ping | grep -q '^PONG$'
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
